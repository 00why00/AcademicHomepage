name: Get Citation Data

on:
  page_build:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r google_scholar_crawler/requirements.txt
      - name: Verify imports and failure handling
        run: |
          python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase; import httpx; httpx.Client(proxies={}).close()"
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch complete citation data
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python google_scholar_crawler/main.py
      - name: Check out the existing data branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: google-scholar-stats
          path: citation-data
      - name: Publish successful snapshot
        run: |
          cp google_scholar_crawler/results/gs_data.json citation-data/
          cp google_scholar_crawler/results/gs_data_shieldsio.json citation-data/
          cd citation-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Google Scholar citations"
            git push origin HEAD:google-scholar-stats
          fi
