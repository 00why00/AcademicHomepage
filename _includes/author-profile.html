{% assign author = site.author %}
<div itemscope itemtype="https://schema.org/Person" class="profile_box">
  <div class="author__avatar">
    <img src="{{ author.avatar | relative_url }}" width="350" height="350" alt="{{ author.name | escape }}" itemprop="image" fetchpriority="high">
  </div>
  <div class="author__content">
    <h1 class="author__name" itemprop="name"><span>{{ author.name | escape }}</span>{% if author.name_native %} <span class="author__native-name" lang="zh">({{ author.name_native | escape }})</span>{% endif %}</h1>
    <p class="author__bio" itemprop="affiliation">{{ author.bio }}</p>
  </div>
  <div class="author__urls-wrapper">
    <p class="author__location"><i class="fas fa-fw fa-map-marker-alt" aria-hidden="true"></i> {{ author.location }}</p>
    <ul class="author__urls social-icons" aria-label="Contact and profiles">
      <li><a href="mailto:{{ author.email }}" aria-label="Email {{ author.name | escape }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i><span class="author__link-label"> Email</span></a></li>
      <li><a href="https://github.com/{{ author.github }}" aria-label="{{ author.name | escape }} on GitHub" itemprop="sameAs"><i class="fab fa-fw fa-github" aria-hidden="true"></i><span class="author__link-label"> GitHub</span></a></li>
      <li><a href="{{ author.googlescholar }}" aria-label="{{ author.name | escape }} on Google Scholar" itemprop="sameAs"><i class="fas fa-fw fa-graduation-cap" aria-hidden="true"></i><span class="author__link-label"> Google Scholar</span></a></li>
      <li><a href="{{ author.orcid }}" aria-label="{{ author.name | escape }} on ORCID" itemprop="sameAs"><i class="ai ai-orcid ai-fw" aria-hidden="true"></i><span class="author__link-label"> ORCID</span></a></li>
    </ul>
  </div>
</div>
